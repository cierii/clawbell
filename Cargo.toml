[workspace]
members = [
    "crates/audit",
    "crates/clawbell",
    "crates/core",
    "crates/proxy",
    "crates/sandbox",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cierii/clawbell"
readme = "README.md"
keywords = ["mcp", "proxy", "sandbox", "security"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
tokio = { version = "1.48", features = ["io-util", "io-std", "macros", "process", "rt-multi-thread", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rmcp = { version = "3.8", default-features = false, features = ["client", "server"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
multiple_crate_versions = "allow"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
